<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | On-CafeNet</title><style>body{font-family:Tahoma;background:#0b1020;color:#fff;margin:0;padding:20px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.cart{background:#18223d;padding:20px;border-radius:16px}.btn{background:#7c5cff;color:#fff;border:0;border-radius:9px;padding:10px;cursor:pointer}.item{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff30;padding:12px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style><div class="wrap"><p><a href="index.html" style="color:#fff">صفحه اصلی</a></p><h1>فروشگاه On-CafeNet</h1><div class="grid" id="products"></div><section class="cart" id="cart"><h2>🛒 سبد خرید</h2><div id="items"></div><h3 id="total"></h3><button class="btn" onclick="checkout()">ادامه در بله</button><button class="btn" onclick="clearCart()">خالی کردن</button></section></div><script>const names=['طراحی سایت','طراحی اپلیکیشن','ساخت لوگو و طراحی گرافیکی','ساخت ویدیو تبلیغاتی با هوش مصنوعی'];let cart=JSON.parse(localStorage.getItem('onCafeCart')||'[]');document.getElementById('products').innerHTML=names.map(n=>`<article class="card"><h2>${n}</h2><p>قیمت: توافقی</p><button class="btn" onclick="add('${n}')">افزودن به سبد</button></article>`).join('');function save(){localStorage.setItem('onCafeCart',JSON.stringify(cart));render()}function add(n){let x=cart.find(i=>i.name===n);x?x.qty++:cart.push({name:n,qty:1});save()}function change(n,d){let x=cart.find(i=>i.name===n);if(x)x.qty+=d;cart=cart.filter(i=>i.qty>0);save()}function remove(n){cart=cart.filter(i=>i.name!==n);save()}function clearCart(){cart=[];save()}function render(){document.getElementById('items').innerHTML=cart.length?cart.map(i=>`<div class="item"><span>${i.name} × ${i.qty}</span><span><button class="btn" onclick="change('${i.name}',-1)">−</button> <button class="btn" onclick="change('${i.name}',1)">+</button> <button class="btn" onclick="remove('${i.name}')">حذف</button></span></div>`).join(''):'سبد خرید خالی است';document.getElementById('total').textContent='تعداد خدمات: '+cart.reduce((s,i)=>s+i.qty,0)}function checkout(){if(!cart.length)return alert('سبد خرید خالی است');location.href='https://ble.ir/on_cafenet'}render();</script></html>

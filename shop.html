<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فروشگاه | On-CafeNet</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');:root{--bg:#070b18;--card:#121c34;--muted:#a5b1cc;--purple:#8b5cf6;--cyan:#22d3ee;--line:#ffffff15}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#28205a,transparent 32%),var(--bg);color:#fff;font-family:Vazirmatn,Tahoma;line-height:1.9}.wrap{width:min(1120px,92%);margin:auto}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:10;background:#070b18e8;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.brand{font-size:1.4rem;font-weight:900}.brand b{color:var(--cyan)}.nav a{color:#c6cde0}.hero{text-align:center;padding:65px 0 40px}.hero h1{font-size:clamp(2rem,5vw,3.6rem);margin:0;background:linear-gradient(100deg,#fff,#a5b4fc,#67e8f9);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card,.cart{background:linear-gradient(145deg,#16213c,#0e1629);border:1px solid var(--line);border-radius:22px;padding:23px}.card{display:flex;flex-direction:column}.card p{color:var(--muted);font-size:.88rem;flex:1}.icon{font-size:2.4rem}.price{color:#c4b5fd;margin:10px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(100deg,var(--purple),#6366f1);color:#fff;font:inherit;font-weight:800;cursor:pointer}.cart{margin:45px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}.muted{color:var(--muted)}.qty button,.remove{border:0;border-radius:8px;padding:4px 10px;color:#fff;background:#344568;cursor:pointer}.remove{background:#b83259}.total{font-size:1.1rem;font-weight:800;margin:20px 0}.empty{color:var(--muted);padding:25px;text-align:center}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.item{flex-wrap:wrap}}
</style></head>
<body><header><div class="wrap nav"><a class="brand" href="index.html">On-<b>CafeNet</b></a><a href="index.html">صفحه اصلی ↩</a></div></header>
<main class="wrap"><section class="hero"><h1>فروشگاه خدمات دیجیتال</h1><p>خدمت موردنظرت را انتخاب کن و به سبد خرید اضافه کن.</p></section><section class="grid" id="products"></section><section class="cart" id="cart"><h2>🛒 سبد خرید</h2><div id="items"></div><div class="total" id="total"></div><button class="btn" onclick="checkout()">ادامه در بله ↗</button> <button class="btn" onclick="clearCart()">خالی کردن سبد</button></section></main>
<script>
const services=[['🌐','طراحی سایت','ساخت سایت حرفه‌ای و واکنش‌گرا'],['📱','طراحی اپلیکیشن','طراحی UI/UX برای اپلیکیشن'],['🎨','ساخت لوگو و طراحی گرافیکی','طراحی هویت بصری و محتوای گرافیکی'],['🤖','ساخت ویدیو تبلیغاتی با هوش مصنوعی','تولید ویدیوی تبلیغاتی خلاقانه']];
let cart=JSON.parse(localStorage.getItem('onCafeCart')||'[]');
document.getElementById('products').innerHTML=services.map(s=>`<article class="card"><div class="icon">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p><div class="price">قیمت: توافقی</div><button class="btn" onclick="add('${s[1]}')">افزودن به سبد</button></article>`).join('');
function save(){localStorage.setItem('onCafeCart',JSON.stringify(cart));render()}function add(name){let x=cart.find(i=>i.name===name);x?x.qty++:cart.push({name,qty:1});save()}function change(name,n){let x=cart.find(i=>i.name===name);if(x)x.qty+=n;cart=cart.filter(i=>i.qty>0);save()}function remove(name){cart=cart.filter(i=>i.name!==name);save()}function clearCart(){cart=[];save()}function render(){document.getElementById('items').innerHTML=cart.length?cart.map(i=>`<div class="item"><span>${i.name}<br><span class="muted">تعداد: ${i.qty}</span></span><span><button class="qty" onclick="change('${i.name}',-1)">−</button> <button class="qty" onclick="change('${i.name}',1)">+</button> <button class="remove" onclick="remove('${i.name}')">حذف</button></span></div>`).join(''):'<div class="empty">سبد خرید شما خالی است.</div>';document.getElementById('total').textContent='تعداد خدمات: '+cart.reduce((s,i)=>s+i.qty,0)}function checkout(){if(!cart.length)return alert('سبد خرید خالی است.');window.open('https://ble.ir/on_cafenet','_blank')}render();
</script></body></html>
